name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.archive }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: invitext-linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            archive: invitext-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            archive: invitext-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: invitext-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/itx dist/
          cp target/${{ matrix.target }}/release/invitext dist/
          cp README.md LICENSE FORMAT.md dist/
          tar -C dist -czf ${{ matrix.archive }}.tar.gz itx invitext README.md LICENSE FORMAT.md
          shasum -a 256 ${{ matrix.archive }}.tar.gz > ${{ matrix.archive }}.tar.gz.sha256
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/itx.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/invitext.exe" dist/
          Copy-Item README.md, LICENSE, FORMAT.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}.zip"
          $hash = (Get-FileHash "${{ matrix.archive }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}.zip" | Set-Content "${{ matrix.archive }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}.*

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
